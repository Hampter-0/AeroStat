name: Docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: hampternom

permissions:
  contents: read

jobs:
  # Each platform builds on its own native runner, so nothing runs under
  # emulation. The images are pushed by digest and tagged in the merge job.
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKERHUB_NAMESPACE }}/aerostat-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/aerostat-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Create the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.DOCKERHUB_NAMESPACE }}/aerostat-${{ matrix.image }}@sha256:%s ' *)

      - name: Show the result
        run: docker buildx imagetools inspect ${{ env.DOCKERHUB_NAMESPACE }}/aerostat-${{ matrix.image }}:${{ steps.meta.outputs.version }}

  # The panel's update notice links to this release.
  release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub's own notes only list pull requests. Changes land on main
      # directly, so the notes are built from the commits since the last tag,
      # grouped by their feat: / fix: prefix.
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          NAMESPACE: ${{ env.DOCKERHUB_NAMESPACE }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          range="$TAG"
          if [ -n "$previous" ]; then
            range="$previous..$TAG"
          fi
          git log --no-merges --reverse --format='%s' "$range" > "$RUNNER_TEMP/subjects.txt"

          section() {
            local title="$1" pattern="$2"
            local lines
            lines=$(grep -E "$pattern" "$RUNNER_TEMP/subjects.txt" | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//' | sed -E 's/^(.)/\U\1/' | sed 's/^/- /' || true)
            if [ -n "$lines" ]; then
              printf '## %s\n\n%s\n\n' "$title" "$lines"
            fi
          }

          version="${TAG#v}"
          # A "## 1.2.3" section in CHANGELOG.md, when there is one, says it
          # in more detail than the commit subjects.
          written=""
          if [ -f CHANGELOG.md ]; then
            written=$(awk -v v="$version" '
              /^## / { if (found) exit; if ($2 == v || $2 == "v" v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d')
          fi
          {
            if [ -n "$written" ]; then
              printf '%s\n\n' "$written"
            else
              section "New" '^feat(\(|!|:)'
              section "Fixes" '^fix(\(|!|:)'
              section "Other changes" '^(chore|docs|refactor|perf|style|test|build|ci)(\(|!|:)'
              others=$(grep -Ev '^(feat|fix|chore|docs|refactor|perf|style|test|build|ci)(\(|!|:)' "$RUNNER_TEMP/subjects.txt" | sed 's/^/- /' || true)
              if [ -n "$others" ]; then
                printf '## More\n\n%s\n\n' "$others"
              fi
            fi
            printf '## Update\n\n'
            printf 'Back up first if you want to, then pull the new images and restart:\n\n'
            printf '```bash\ndocker compose pull && docker compose up -d\n```\n\n'
            printf 'Images: `%s/aerostat-backend:%s` and `%s/aerostat-frontend:%s`. Database migrations run on their own when the backend starts.\n\n' "$NAMESPACE" "$version" "$NAMESPACE" "$version"
            if [ -n "$previous" ]; then
              printf '**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$previous" "$TAG"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
