[package]
name = "statuspage-backend"
version = "0.22.1"
edition = "2021"

[dependencies]
owo-colors = "4"
clap = { version = "4", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
tower-http = { version = "0.5", features = ["trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
deadpool-redis = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
rpassword = "7"
serde_json = "1"
chrono-tz = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "=0.6.2"
totp-rs = { version = "5", features = ["qr", "gen_secret", "otpauth"] }
aes-gcm = "0.10"
